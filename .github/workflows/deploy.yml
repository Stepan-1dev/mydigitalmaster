name: CI/CD Pipeline
run-name: ${{ github.actor }} is testing
on: [push]
jobs:

  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build with Maven
        run: mvn clean package

      - name: Build docker image
        run: docker build -t mydigitalmaster .

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN}}

      - name: Give name of image
        run: docker tag mydigitalmaster dezenfection/mydigitalmaster

      - name: Push docker image in Docker Hub
        run: docker push dezenfection/mydigitalmaster

      - name: Deploy over SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /home/user1/app || exit
            sudo docker pull dezenfection/mydigitalmaster
            sudo docker stop mydigitalmaster || true
            sudo docker rm mydigitalmaster || true
            sudo docker run -d --name mydigitalmaster -p 9090:8080 --restart unless-stopped dezenfection/mydigitalmaster
            
            

